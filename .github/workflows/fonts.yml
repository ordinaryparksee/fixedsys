name: Build and Release Fonts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpp

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build and verify fonts
        run: make verify

      - name: Create checksums
        run: sha256sum FSEX302.ttf FSEX302-alt.ttf > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fixedsys-fonts
          path: |
            FSEX302.ttf
            FSEX302-alt.ttf
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified fonts
        uses: actions/download-artifact@v8
        with:
          name: fixedsys-fonts
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(dist/FSEX302.ttf dist/FSEX302-alt.ttf dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
